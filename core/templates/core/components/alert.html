<div class="hms-alert hms-alert-{{ level|default:'info' }}{% if dismissible %} hms-alert-dismissible{% endif %}" role="alert">
  <div class="hms-alert-icon" aria-hidden="true">
    {% if level == 'success' %}
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg>
    {% elif level == 'warning' %}
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>
    {% elif level == 'danger' or level == 'error' %}
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
    {% else %}
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    {% endif %}
  </div>
  <div class="hms-alert-content">
    {% if title %}<strong class="hms-alert-title">{{ title }}</strong>{% endif %}
    <div class="hms-alert-message">{% if message %}{{ message }}{% else %}{{ content }}{% endif %}</div>
  </div>
  {% if dismissible %}
    <button type="button" class="hms-alert-close" aria-label="Dismiss alert" onclick="this.closest('.hms-alert').remove();">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  {% endif %}
</div>
